<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>Карта мест — Сургут</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #map { background: #e8edf0; }
    .map-heading {
      position: absolute; z-index: 500; top: 14px; left: 50%; transform: translateX(-50%);
      max-width: calc(100% - 110px); padding: 10px 16px; border-radius: 14px;
      background: rgba(255,255,255,.95); box-shadow: 0 2px 14px #0002;
      font-size: 15px; font-weight: 650; white-space: nowrap; pointer-events: none;
    }
    .leaflet-popup-content-wrapper { border-radius: 14px; }
    .leaflet-popup-content { width: 240px !important; margin: 13px; }
    .place-popup h3 { margin: 0 0 6px; font-size: 16px; line-height: 1.3; }
    .place-popup p { margin: 0 0 10px; color: #59616b; font-size: 13px; line-height: 1.4; }
    .place-popup .gallery { display: grid; gap: 7px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .place-popup .gallery img { width: 100%; height: 92px; object-fit: cover; border-radius: 8px; display: block; }
    .place-popup .no-photos { padding: 12px; background: #f2f4f7; border-radius: 8px; font-size: 12px; color: #59616b; }
    .leaflet-container a { color: #1769aa; }
    @media (max-width: 520px) {
      .map-heading { top: 10px; font-size: 14px; padding: 9px 12px; }
      .leaflet-popup-content { width: 220px !important; }
    }
  </style>
</head>
<body>
  <div class="map-heading">Места Сургута · нажмите на метку</div>
  <div id="map" aria-label="Интерактивная карта с метками"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./script.js"></script>
</body>
</html>
